# Whole run (~120 tasks + setup + vLLM start) must finish in 12 h or it scores nothing.
# v2 eval (34 calls / 7.5 min, thinking 4096): mean 367 s/task -> 12.3 h projected, too tight.
# v3: thinking 2048 + 6.5 min cap -> target mean <= 320 s (~10.8 h).
evaluation:
  timeout_seconds: 180
  max_tool_calls: 34
  max_time_minutes: 6.5
  max_turns: 70
